[project]
name = "interactive-storytelling-assistant"
version = "2.0.0"
description = "Interactive Storytelling Assistant for Kids - A LangGraph-based chatbot with safety guardrails"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["chatbot", "storytelling", "kids", "education", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Communications :: Chat",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastrtc",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "langgraph>=0.0.10",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "fastapi",
    "uvicorn",
    "twilio",
    "gradio",
    "python-dotenv",
    "transformers>=4.56.0",
    "torch>=2.8.0",
    "kokoro>=0.9.4",
    "pip>=25.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pyaudio",
    "numpy"
]

[project.urls]
Homepage = "https://github.com/yourusername/interactive-storytelling-assistant"
Repository = "https://github.com/yourusername/interactive-storytelling-assistant"
Issues = "https://github.com/yourusername/interactive-storytelling-assistant/issues"

[project.scripts]
storytelling-web = "main:main"
storytelling-cli = "src.storytelling.core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pyaudio>=0.2.14",
    "pyttsx3>=2.99",
    "speechrecognition>=3.14.3",
]
